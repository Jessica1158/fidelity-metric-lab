[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "p04-fidelity-lab"
version = "0.1.0"
description = "Controlled defect injection and fidelity metric experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false